{% extends "public/base.html" %}
{% block content %}
{% set homepage_img = global_settings.meta.get("homepage_" + session['lang'] + "_image", '') %}
<style>
    main {
        margin-bottom: 0 !important;
        padding: 0 !important;
        max-height: 100vh;
    }

    .hero {
        position: relative;
        /* Forza aspect ratio 16:9 */
        aspect-ratio: 16 / 9;
        width: 100%;
        max-height: 100vh;
        overflow: hidden;
    }

    .hero::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
        z-index: 2;
    }

    /* Contenitore per l'immagine di background */
    .hero-background {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-position: center center;
        background-size: cover;
        background-repeat: no-repeat;
        z-index: 1;
    }

    html {
    }

    .hero-body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        position: relative;
        z-index: 3;
    }

    .container {
        text-align: center;
        width: 100%;
        max-width: none;
    }

    /* Fallback per browser che non supportano aspect-ratio */
    @supports not (aspect-ratio: 16 / 9) {
        .hero {
            padding-top: 56.25%;
            /* 9/16 * 100% */
            height: 0;
            position: relative;
        }

        .hero-body {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    }

    .content  > .container {
        display: flex;
        flex-direction: column;
    } 
</style>
<section class="hero p-5" style="max-height: 1080px;">
    <!-- Div separato per l'immagine di background -->
    {% if homepage_img != '' %}
    <div class="hero-background" style="background-image: url('{{ url_for('static', filename=homepage_img) }}');"></div>
    {% endif %}
    <div class="hero-body">
        <div class="container">
        </div>
    </div>
</section>
<section>
    <a href="{{ url_for('public.index') }}" class="button is-primary is-large is-rounded mt-4 mb-6">
        <span class="icon"><i class="lni lni-cart-1"></i></span>
        <span>{{ _('Go to shop') }}</span>
    </a>
</section>
{% endblock %}
{% block scripts %}
{% endblock %}
