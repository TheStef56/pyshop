{% extends "admin/base.html" %}

{% block title %}Password recovery - {{session['settings']['header']['site_name']}}{% endblock %}

{% block content %}
    <div class="columns is-centered">
        <div class="column is-one-third">
            <h2 class="title is-2 has-text-centered">Login</h2>

            {% if error %}
                <div class="notification is-danger is-light">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login.recovery_password') }}?hash={{ hash }}" static="true">
                <div class="field">
                    <label class="label" for="password">New password:</label>
                    <div class="control">
                        <input class="input" type="password" id="password" name="password" required>
                    </div>
                </div>

                <div class="field">
                    <label class="label" for="confirm-password">Confirm password:</label>
                    <div class="control">
                        <input class="input" type="password" id="confirm-password" name="confirm-password" required>
                    </div>
                </div>

                <div class="field">
                    <div class="control has-text-centered">
                        <button class="button is-primary is-fullwidth" type="submit">Update</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
{% block scripts %}

{% endblock %}
