{% extends "admin/base.html" %}

{% block title %}Categorie{% endblock %}

{% block content %}
<!-- jsTree CSS -->
<!--TODO: rendi static-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jstree/dist/themes/default/style.min.css" />

<!-- jQuery + jsTree -->
<!--TODO: rendi static-->
<script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jstree/dist/jstree.min.js"></script>

<div class="container">
    <h1 class="title is-4">
        <i class="lni lni-folder-1"></i> Gestione Categorie
    </h1>

    <!-- Selettore lingua -->
    <div class="buttons mb-3 is-flex is-justify-content-space-between">
        <div>
            <button class="button is-link" id="lang-it">🇮🇹 Italiano</button>
            <button class="button is-link" id="lang-en">🇺🇸 English</button>
        </div>
        <button class="button is-primary" onclick="saveCategories()">
            <span class="icon">
                <i class="lni lni-floppy-disk-1"></i>
            </span>
            <span> Salva</span>
        </button>
    </div>
    
    <div class="box is-shadowless">
        <div id="categoryTree"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const categories = {{ categories | tojson }};  // dati multilingua dal backend

let currentLang = 'it';
const $tree = $('#categoryTree');
let allowDelete = false;
let maxId = Math.max(
    0,
    ...categories
        .map(item => parseInt(item.id))
        .filter(num => !isNaN(num))
);

// Funzione per generare dati jsTree nella lingua scelta con ordinamento
function getTreeDataForLang(data, lang) {
    // Prima ordina per sort_order, poi per nome se sort_order è uguale
    const sorted = [...data].sort((a, b) => {
        const orderA = a.sort_order || 0;
        const orderB = b.sort_order || 0;
        
        if (orderA !== orderB) {
            return orderA - orderB;
        }
        
        // Se sort_order è uguale, ordina alfabeticamente
        const textA = (a.text && a.text[lang]) ? a.text[lang] : (a.text.it || "");
        const textB = (b.text && b.text[lang]) ? b.text[lang] : (b.text.it || "");
        return textA.localeCompare(textB);
    });
    
    return sorted.map(node => ({
        ...node,
        text: (node.text && node.text[lang]) ? node.text[lang] : (node.text.it || "")
    }));
}

function initTree() {
    $tree.jstree({
        core: {
            themes : { "icons" : false },
            data: getTreeDataForLang(categories, currentLang),
            check_callback: function (operation, node, parent, position) {
                if (operation === 'create_node') {
                    maxId++;
                    node.id = String(maxId);
                    
                    // Calcola sort_order basato sulla posizione
                    const siblings = parent === '#' ? 
                        categories.filter(c => !c.parent) : 
                        categories.filter(c => c.parent === parent);
                    const newSortOrder = position * 10 + 10; // lascia spazio per inserimenti
                    
                    // Aggiungiamo al categories array la nuova categoria
                    categories.push({
                        id: node.id,
                        parent: parent === '#' ? null : parent,
                        text: { it: "", en: "" },
                        sort_order: newSortOrder
                    });
                    
                    updateSortOrdersAfterPosition(parent, position);
                    return true;
                }
                if (operation === 'delete_node') {
                    return !!allowDelete;
                }
                if (operation === 'move_node') {
                    // NON aggiorniamo qui, lo facciamo nell'event listener
                    return true;
                }
                return true;
            }
        },
        plugins: ["contextmenu", "dnd", "search", "state", "types", "wholerow", "unique"],
        types: {
            folder: { icon: "lni lni-folder" }
        },
        contextmenu: {
            items: function (node) {
                const tree = $tree.jstree(true);
                const defaults = $.jstree.defaults.contextmenu.items(node);

                // Traduci voci menu
                if (defaults.create) defaults.create.label = currentLang === 'it' ? "Crea" : "Create";
                if (defaults.rename) defaults.rename.label = currentLang === 'it' ? "Rinomina" : "Rename";
                if (defaults.remove) defaults.remove.label = currentLang === 'it' ? "Elimina" : "Delete";
                if (defaults.cut) defaults.cut.label = currentLang === 'it' ? "Taglia" : "Cut";
                if (defaults.copy) defaults.copy.label = currentLang === 'it' ? "Copia" : "Copy";
                if (defaults.paste) defaults.paste.label = currentLang === 'it' ? "Incolla" : "Paste";

                const n = tree.get_node(node);

                if (defaults.remove) {
                    defaults.remove._disabled = n.children && n.children.length > 0;
                    defaults.remove.action = function () {
                        if (n.children && n.children.length > 0) {
                            window.notyf.error(currentLang === 'it'
                                ? "Non puoi eliminare una categoria che contiene sottocategorie."
                                : "You cannot delete a category that contains subcategories."
                            );
                            return;
                        }
                        if (!confirm(currentLang === 'it'
                            ? "Sei sicuro di voler eliminare questa categoria?"
                            : "Are you sure you want to delete this category?"
                        )) return;

                        fetch(`/admin/categories/delete/${encodeURIComponent(n.id)}`, {
                            method: 'DELETE'
                        })
                        .then(response => {
                            if (response.status === 204) return { status: 'success' };
                            return response.json().catch(() => ({ status: response.ok ? 'success' : 'error' }));
                        })
                        .then(result => {
                            if (result && result.status === 'success') {
                                allowDelete = true;
                                try {
                                    tree.delete_node(n.id);
                                    // Rimuovi dal categories array
                                    const index = categories.findIndex(c => c.id === n.id);
                                    if (index !== -1) categories.splice(index, 1);
                                } finally {
                                    allowDelete = false;
                                }
                                window.notyf.success(currentLang === 'it'
                                    ? 'Categoria eliminata con successo!'
                                    : 'Category deleted successfully!'
                                );
                            } else {
                                window.notyf.error(currentLang === 'it'
                                    ? 'Errore durante l\'eliminazione della categoria.'
                                    : 'Error deleting category.'
                                );
                            }
                        })
                        .catch(error => {
                            console.error('Errore:', error);
                            window.notyf.error(currentLang === 'it'
                                ? 'Errore durante l\'eliminazione della categoria.'
                                : 'Error deleting category.'
                            );
                        });
                    };
                }

                return Object.assign(defaults);
            }
        }
    });
}

function updateSortOrdersAfterPosition(parent, position) {
    const siblings = parent === '#' ? 
        categories.filter(c => !c.parent) : 
        categories.filter(c => c.parent === parent);
    
    siblings.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
    
    siblings.forEach((cat, index) => {
        if (index >= position) {
            cat.sort_order = (cat.sort_order || 0) + 10;
        }
    });
}

// Funzione CORRETTA per aggiornare sort_order dopo drag & drop
function updateSortOrderAfterDragDrop(movedNodeId, newParentId, newPosition) {
    console.log('Updating sort order for:', { movedNodeId, newParentId, newPosition });
    
    const category = categories.find(c => c.id === movedNodeId);
    if (!category) {
        console.error('Categoria non trovata:', movedNodeId);
        return;
    }
    
    // Aggiorna il parent
    category.parent = newParentId === '#' ? null : newParentId;
    
    // Ottieni tutti i siblings nel nuovo parent (escludendo il nodo spostato)
    const siblings = categories.filter(c => {
        const parentMatch = newParentId === '#' ? !c.parent : c.parent === newParentId;
        return parentMatch && c.id !== movedNodeId;
    });
    
    // Ordina i siblings per sort_order
    siblings.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
    
    console.log('Siblings ordinati:', siblings.map(s => ({ id: s.id, sort_order: s.sort_order })));
    
    // Calcola il nuovo sort_order in base alla posizione
    let newSortOrder;
    
    if (siblings.length === 0) {
        // È l'unico figlio
        newSortOrder = 10;
    } else if (newPosition === 0) {
        // Prima posizione
        newSortOrder = Math.max(1, (siblings[0].sort_order || 10) - 5);
    } else if (newPosition >= siblings.length) {
        // Ultima posizione
        newSortOrder = (siblings[siblings.length - 1].sort_order || 0) + 10;
    } else {
        // Posizione intermedia
        const prevOrder = siblings[newPosition - 1].sort_order || 0;
        const nextOrder = siblings[newPosition].sort_order || (prevOrder + 20);
        newSortOrder = Math.floor((prevOrder + nextOrder) / 2);
        
        // Se il calcolo dà un valore uguale a uno esistente, riorganizza
        if (newSortOrder <= prevOrder || newSortOrder >= nextOrder) {
            console.log('Riorganizzazione necessaria per', newParentId);
            reorderSiblings(newParentId);
            // Ricalcola dopo la riorganizzazione
            const reorganizedSiblings = categories.filter(c => {
                const parentMatch = newParentId === '#' ? !c.parent : c.parent === newParentId;
                return parentMatch && c.id !== movedNodeId;
            }).sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
            
            if (newPosition >= reorganizedSiblings.length) {
                newSortOrder = (reorganizedSiblings[reorganizedSiblings.length - 1]?.sort_order || 0) + 10;
            } else {
                const prevOrder = newPosition > 0 ? reorganizedSiblings[newPosition - 1].sort_order : 0;
                newSortOrder = prevOrder + 5;
            }
        }
    }
    
    category.sort_order = newSortOrder;
}

function reorderSiblings(parentId) {
    const siblings = parentId === '#' || parentId === null ? 
        categories.filter(c => !c.parent) : 
        categories.filter(c => c.parent === parentId);
    
    siblings.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
    
    siblings.forEach((cat, index) => {
        cat.sort_order = (index + 1) * 10;
    });
}

function moveNode(nodeId, direction) {
    const tree = $tree.jstree(true);
    const node = tree.get_node(nodeId);
    const parent = tree.get_node(node.parent);
    const siblings = parent.children || [];
    const currentIndex = siblings.indexOf(nodeId);
    
    let newIndex;
    if (direction === 'up' && currentIndex > 0) {
        newIndex = currentIndex - 1;
    } else if (direction === 'down' && currentIndex < siblings.length - 1) {
        newIndex = currentIndex + 1;
    } else {
        return; // Non può muoversi
    }
    
    tree.move_node(nodeId, node.parent, newIndex);
}

function switchLanguage(lang) {
    currentLang = lang;
    const tree = $tree.jstree(true);
    
    // Aggiorna testo nodi dal categories array
    categories.forEach(node => {
        tree.rename_node(node.id, node.text[lang] || node.text.it || "");
    });

    // Aggiorna pulsanti di selezione lingua
    $('#lang-it').toggleClass('is-link', lang === 'it');
    $('#lang-en').toggleClass('is-link', lang === 'en');
    
    // Aggiorna testi help
    $('#help-text-it').toggle(lang === 'it');
    $('#help-text-en').toggle(lang === 'en');
    
    // Aggiorna testo bottone riordina
    const reorderBtn = $('button').filter(function() {
        return $(this).attr('onclick') === 'reorderByName()';
    });
    reorderBtn.find('span').last().text(lang === 'it' ? 'Ordina A-Z' : 'Sort A-Z');
}

function saveCategories() {
    const treeData = $('#categoryTree').jstree(true).get_json('#', { flat: true });

    var i = 0
    treeData.forEach((node, index) => {
        const c = categories.find(c => c.id === node.id);
        if (c) {
            c.text[currentLang] = node.text;
            c.parent = node.parent === '#' ? null : node.parent;
            c.sort_order = i
        }
        i++
    });

    fetch('/admin/categories/save', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(categories)
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            window.notyf.success(currentLang === 'it'
                ? 'Categorie salvate con successo!'
                : 'Categories saved successfully!'
            );
        } else {
            window.notyf.error(currentLang === 'it'
                ? 'Errore durante il salvataggio delle categorie.'
                : 'Error saving categories.'
            );
        }
    })
    .catch(error => {
        console.error('Errore:', error);
        window.notyf.error(currentLang === 'it'
            ? 'Errore durante il salvataggio delle categorie.'
            : 'Error saving categories.'
        );
    });
}

$(function () {
    // Inizializza sort_order se mancante
    categories.forEach((cat, index) => {
        if (typeof cat.sort_order === 'undefined' || cat.sort_order === null) {
            cat.sort_order = (index + 1) * 10;
        }
    });
    
    initTree();
    switchLanguage(currentLang);

    $('#lang-it').on('click', () => switchLanguage('it'));
    $('#lang-en').on('click', () => switchLanguage('en'));

    // Mostra bottone debug se console è aperta o in development
    if (typeof console !== 'undefined' && console.log) {
        $('#debug-btn').show();
    }

    $tree.on('rename_node.jstree', function (e, data) {
        if (data.text.trim() === '') {
            window.notyf.error(currentLang === 'it'
                ? 'Il nome della categoria non può essere vuoto.'
                : 'Category name cannot be empty.'
            );
            data.instance.refresh();
        } else {
            // Aggiorna il categories array per la lingua corrente
            const c = categories.find(c => c.id === data.node.id);
            if (c) {
                c.text[currentLang] = data.text;
            }
        }
    });
    
    // Event listener CORRETTO per il drag & drop
    $tree.on('move_node.jstree', function (e, data) {
        window.notyf.success(currentLang === 'it'
            ? 'Categoria spostata! Ricorda di salvare.'
            : 'Category moved! Remember to save.'
        );
    });
});
</script>
{% endblock %}
